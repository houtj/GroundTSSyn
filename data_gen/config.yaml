signal_length: 512

nb_event_occurrence: [2, 7]
pdf_nb_event_occurrence: "uniform"

nb_primitives_in_event: [2, 7]
pdf_nb_primitives_in_event: "uniform"

nb_inter_event_primitives: [0, 5]
pdf_nb_inter_event_primitives: "linear"
min_nb_weight: 5
max_nb_weight: 1

primitive_type_samping_weight:
  spike: 2
  dip: 2
  increase: 3
  decrease: 3
  plateau: 3
  oscillation: 1

min_primitive_length: 8
min_spike_length: 4
max_spike_length: 8

pdf_event_length: "skewed_normal"
event_average_length_weight: 5
event_extreme_length_weight: 2

pdf_primitives_length: "skewed_normal"
primitive_average_length_weight: 5
primitive_extreme_length_weight: 2

event_primitive_peak_2_peak: [1, 10]
pdf_event_primitive_peak_2_peak: "uniform"
inter_event_primitive_peak_2_peak: [0, 5]
pdf_inter_event_primitive_peak_2_peak: "uniform"

# Per-feature scope/pdf for the remaining generative features (slopes, durations,
# recovery, frequency, etc.) live in feature_schema.yaml.

# Open: weight per feature for constraint sampling (or a smarter way to pick
# distinctive features).
# Open: how to bucketize numerical features (low/med/high amplitude,
# short/med/long duration) for interpretability and constraint specification.

nb_constraints: [0, 3]
pdf_nb_constraints: [0.7, 0.1, 0.1, 0.1]

jitter_randomness: 0

numerical_constraint_weight: 0
comparable_constraint_weight: 4

drift_limit: true
drift_threshold: 0.1

max_junction_angle_deg: 175.0

# Additive white Gaussian noise on the final z-normed signal.
# σ is sampled per signal from `noise_level` (z-normed units, since the clean
# signal has unit std). For a primitive with peak2peak P, the linear amplitude
# SNR is P/σ. Guideline anchors:
#   σ ≈ 0.02–0.05  → SNR ~20–50× for typical primitives (very clean)
#   σ ≈ 0.1–0.3    → SNR ~3–10×    (reliable detection of large primitives,
#                                    short/small ones become invisible)
#   σ ≈ 0.5+       → SNR ~1–2×     (most primitives invisible)
# The clean signal is preserved alongside the noisy one and is used for
# post-matching and negation; only the noisy signal is the "delivered" output.
add_noise: true
noise_level: [0.01, 0.05]
pdf_noise_level: "uniform"

# Periodical mode: events tile back-to-back across the signal with no
# inter-event primitives. The number of full events is the sampled
# nb_event_occurrence (n); event length L is sampled uniformly in
# [signal_length/(n+2), signal_length/(n-1)] (special case for n=1). The
# tile is then offset randomly along the signal so that edge events may be
# partial — if either the first or last template primitive of an edge event
# is fully truncated, that occurrence is dropped from the grounding.
periodical: false

# Post-pass: after generation, scan inter-event runs for primitive-type
# subsequences matching the event template; if all sampled constraints are
# satisfied, append the run as an extra event occurrence.
post_match:
  enabled: true

# Negative-description generation: mutate the positive grounding and verify
# that the result does not match anywhere in the signal.
negation:
  enabled: true
  max_attempts: 10  # total mutation tries per sample
  target_n: 3       # desired number of verified negatives per sample
